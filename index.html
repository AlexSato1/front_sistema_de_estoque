<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - Lanchonete</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h1>🍔 Sistema de Estoque</h1>
            <h2>Lanchonete Control</h2>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuário:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-login">Entrar</button>
                
                <div class="demo-users">
                    <p><strong>Usuários de Demonstração:</strong></p>
                    <p>👑 <strong>Admin:</strong> user: admin | senha: 123456</p>
                    <p>👤 <strong>Garçom:</strong> user: user2 | senha: 123456</p>
                    <p>👤 <strong>Outros:</strong> user3, user4, user5 | senha: 123456</p>
                </div>
            </form>
            
            <div id="loginError" class="error-message"></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
